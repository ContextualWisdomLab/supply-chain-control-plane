name: Format exact head once

on:
  push:
    branches: [feat/disruption-impact-foundation]
    paths: [.github/format-exact-head.trigger]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/disruption-impact-foundation
          fetch-depth: 0
      - name: Format the live exact head and remove this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='feat/disruption-impact-foundation'
          starting_head="$(git rev-parse HEAD)"
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq '.commit.sha')"
          test "$live_head" = "$starting_head"

          cargo fmt --all
          rm .github/workflows/format-exact-head-once.yml .github/format-exact-head.trigger
          git diff --check

          latest_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq '.commit.sha')"
          test "$latest_head" = "$starting_head"

          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format replay and security tests'
          git push origin "HEAD:${branch}"
