name: Repair exact-head coverage once

on:
  push:
    branches: [feat/disruption-impact-foundation]
    paths: [.github/repair-coverage-exact-head.trigger]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/disruption-impact-foundation
          fetch-depth: 0
      - uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5
        with:
          tool: cargo-llvm-cov@0.9.0
          checksum: true
      - name: Cover blank dependency upsert paths and remove diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='feat/disruption-impact-foundation'
          starting_head="$(git rev-parse HEAD)"
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq '.commit.sha')"
          test "$live_head" = "$starting_head"

          python3 <<'PY'
          from pathlib import Path

          test_path = Path("tests/disruption_impact.rs")
          text = test_path.read_text(encoding="utf-8")
          marker = "    assert_eq!(\n        graph.upsert_node(\" \", SupplyNodeKind::Supplier),\n        Err(GraphError::BlankField(\"supply_node_key\"))\n    );\n"
          addition = "    assert_eq!(\n        graph.upsert_dependency(\n            \" \",\n            \"supplier-alpha\",\n            dependency_evidence(\"edge-blank-upstream\"),\n        ),\n        Err(GraphError::BlankField(\"upstream_supply_node_key\"))\n    );\n    assert_eq!(\n        graph.upsert_dependency(\n            \"supplier-alpha\",\n            \" \",\n            dependency_evidence(\"edge-blank-downstream\"),\n        ),\n        Err(GraphError::BlankField(\"downstream_supply_node_key\"))\n    );\n"
          if "edge-blank-upstream" not in text:
              if marker not in text:
                  raise SystemExit("upsert validation insertion marker not found")
              test_path.write_text(text.replace(marker, marker + addition, 1), encoding="utf-8")

          for path in [
              ".github/workflows/coverage-region-diagnostic.yml",
              ".github/coverage-region-diagnostic.trigger",
              ".github/workflows/repair-coverage-exact-head-once.yml",
              ".github/repair-coverage-exact-head.trigger",
          ]:
              candidate = Path(path)
              if candidate.exists():
                  candidate.unlink()
          PY

          cargo fmt --all
          cargo check --all-targets --all-features --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          cargo test --doc --all-features --locked
          cargo llvm-cov clean
          cargo llvm-cov \
            --all-features \
            --all-targets \
            --locked \
            --fail-under-lines 100 \
            --fail-under-functions 100 \
            --fail-under-regions 100 \
            --show-missing-lines
          git diff --check

          latest_head="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq '.commit.sha')"
          test "$latest_head" = "$starting_head"

          git config user.name 'opencode-agent[bot]'
          git config user.email '219766164+opencode-agent[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: cover dependency upsert validation regions'
          git push origin "HEAD:${branch}"
